<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Shoppc Admin - Hệ thống quản lý cửa hàng máy tính" />
    <meta name="keywords" content="admin, shoppc, quản lý cửa hàng, máy tính" />
    <meta name="author" content="Shoppc" />
    <title>Shoppc Admin - Hệ thống quản lý</title>
    <!-- Đặt giao diện sáng/tối TRƯỚC khi vẽ trang để không bị chớp trắng -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('shoppc_theme');
          if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (t === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" content="#4f46e5" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
